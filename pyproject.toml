[project]
name = "student-analysis-project"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.2",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.vercel]
entrypoint = "Student_Analysis_Project.app.main:app"